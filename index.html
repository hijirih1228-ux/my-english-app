<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My English Ver.2.1</title><style>*{box-sizing:border-box} :root{color-scheme:light;--ink:#101827;--blue:#3159ee;--muted:#68758a} body{margin:0;background:#edf1f7;color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}main{max-width:640px;margin:auto;padding:20px 18px 48px}header{position:relative;overflow:hidden;background:linear-gradient(135deg,#101827,#23376b);color:white;border-radius:28px;padding:28px 24px 30px;box-shadow:0 12px 28px #172b5422}header:after{content:"";position:absolute;width:210px;height:210px;border:1px solid #ffffff30;border-radius:50%;right:-80px;top:-80px;box-shadow:0 0 0 28px #ffffff09,0 0 0 56px #ffffff09;pointer-events:none}header small{color:#b9c9f7;letter-spacing:2px;font-size:10px;font-weight:700}h1{font-size:39px;letter-spacing:-2px;margin:16px 0 6px;line-height:1.1}header p{margin:0;color:#d8e1fa;font-size:13px}header .version{display:inline-block;margin-top:18px;border:1px solid #ffffff40;border-radius:30px;padding:5px 10px;font-size:10px;letter-spacing:1px}small{color:var(--muted)}section{background:white;border:1px solid #e1e6ef;border-radius:24px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #172b5408}#stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center;padding:17px 8px}#stats div+div{border-left:1px solid #e8edf4}#stats strong{display:block;font-size:25px;letter-spacing:-1px;color:var(--blue)}#stats small{font-size:11px}button,select,input{font:inherit;font-size:14px;padding:13px 10px;min-height:46px;border:1px solid #dfe5ef;border-radius:13px;background:#f7f9fc;color:inherit}button{cursor:pointer;font-weight:650;transition:transform .15s,background .15s}button:active:not(:disabled){transform:scale(.97)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8fa8ff;outline-offset:2px}nav,.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:white;border-radius:19px;padding:6px;box-shadow:0 4px 15px #172b5409}nav button{font-size:11px;padding:10px 2px;border:0;background:transparent;min-width:0}nav button span{display:block;font-size:19px;margin-bottom:5px}.row button{flex:1 1 85px}button.active,.primary{background:var(--blue);color:white;border-color:transparent;box-shadow:0 5px 12px #3159ee28}select,input,.wide{width:100%}input{font-size:16px;background:white}#count{font-size:12px;font-weight:700;color:var(--muted);margin:18px 0 6px}progress{width:100%;height:7px;border:0;border-radius:10px;overflow:hidden;appearance:none;background:#e8edf5;display:block}progress::-webkit-progress-bar{background:#e8edf5;border-radius:10px}progress::-webkit-progress-value{background:var(--blue);border-radius:10px}#situation{display:inline-block;background:#eef2ff;color:#3159cc;font-size:11px;font-weight:700;border-radius:8px;padding:5px 9px;margin:24px 0 0}#english{font-size:clamp(25px,7vw,34px);font-weight:800;letter-spacing:-.8px;line-height:1.35;margin:15px 0}p{line-height:1.7}#jp{font-size:15px;margin:12px 0 4px}#kata,#note{color:var(--muted);font-size:13px;margin:4px 0 15px}#listen{min-height:54px;font-size:15px}#mic{background:#eaf0ff;color:#2448c8;border-color:#dce5ff}#next{background:var(--ink);color:white}#feedback{white-space:pre-wrap;color:#175d46;font-size:14px}#feedback:not(:empty){background:#eef8f2;padding:14px;border-radius:12px}#grammar h3{font-size:24px;letter-spacing:-.5px}hr{border:0;border-top:1px solid #e4e9f1;margin:22px 0}#status{font-size:13px;color:var(--muted)}[hidden]{display:none!important}</style></head><body><main><header><small>YOUR PERSONAL ENGLISH COACH</small><h1>My English.</h1><p>毎日少しずつ、話せる英語へ。</p><span class="version">VER. 2.1 · STUDIO EDITION</span></header><section id="stats"></section><nav id="nav"></nav><section id="lesson"><select id="category"><option value="">すべての場面</option></select><p id="count"></p><progress id="bar" value="0" max="1"></progress><p id="situation"></p><p id="english"></p><p id="jp"></p><p id="kata"></p><p id="note"></p><button class="primary wide" id="listen">▶ 英語を聞く</button><div class="row"><button id="slow">ゆっくり再生</button><button id="fav">★ 保存</button></div><input id="answer" placeholder="英語を入力・またはマイクで話す" autocomplete="off"><div class="row"><button id="mic">🎙 話す</button><button id="check">答え合わせ</button><button id="reveal">答えを見る</button></div><p id="feedback" role="status"></p><div class="row"><button id="prev">← 前へ</button><button id="next">次へ →</button></div></section><section id="grammar" hidden></section><p id="status" role="status"></p></main><script>
const $=id=>document.getElementById(id);function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{$('status').textContent='端末に保存できませんでした'}}let fav=read('favorites',[]),hist=read('englishV2History',{}),weak=read('englishV2Weak',[]),all=[],items=[],i=0,mode='lesson',recognition=null;const modes={lesson:'レッスン',quiz:'英作文',talk:'模擬会話',review:'復習',grammar:'文法'};const talks=[['空港','Hello! Where are you flying today?','I’m going to Paris.','パリに行きます。','アイム ゴーイング トゥ パリ'],['空港','May I see your passport?','Sure, here you go.','はい、どうぞ。','シュア ヒア ユー ゴー'],['空港','Window or aisle seat?','Window seat, please.','窓側の席をお願いします。','ウィンドウ シート プリーズ'],['カフェ','What would you like?','Can I have a coffee, please?','コーヒーをお願いします。','キャナイ ハヴ ア コーヒー プリーズ'],['カフェ','Anything else?','No, that’s all, thank you.','いいえ、以上です。','ノウ ザッツ オール サンキュー'],['ホテル','Do you have a reservation?','Yes, I have a reservation.','はい、予約しています。','イエス アイ ハヴ ア レザヴェイション'],['買い物','Can I help you?','I’m just looking, thanks.','見ているだけです。','アイム ジャスト ルッキング サンクス']];
function day(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function stats(){let d=new Date(),s=0;if(!hist[day(d)])d.setDate(d.getDate()-1);while(hist[day(d)]){s++;d.setDate(d.getDate()-1)}$('stats').innerHTML=[[hist[day()]||0,'今日の練習 · 回'],[s,'連続学習 · 日'],[new Set([...fav,...weak]).size,'復習 · 件']].map(([n,t])=>'<div><strong>'+Number(n)+'</strong><small>'+t+'</small></div>').join('')}function record(){hist[day()]=(hist[day()]||0)+1;store('englishV2History',hist);stats()}
function parse(t){let rows=[],r=[],v='',q=false;for(let j=0;j<t.length;j++){let c=t[j];if(c==='"'){if(q&&t[j+1]==='"'){v+='"';j++}else q=!q}else if(c===','&&!q){r.push(v);v=''}else if(c==='\n'&&!q){r.push(v);rows.push(r);r=[];v=''}else if(c!=='\r')v+=c}if(v||r.length){r.push(v);rows.push(r)}return rows}
function categories(){let a=mode==='talk'?talks:all;$('category').replaceChildren(new Option('すべての場面',''));for(let c of new Set(a.map(r=>r[0])))$('category').add(new Option(c,c))}function filter(){items=(mode==='talk'?talks:all).filter(r=>(!$('category').value||r[0]===$('category').value)&&(mode!=='review'||fav.includes(r[2])||weak.includes(r[2])));i=0;show()}function setMode(m){mode=m;for(let b of $('nav').children)b.classList.toggle('active',b.dataset.mode===m);$('lesson').hidden=m==='grammar';$('grammar').hidden=m!=='grammar';categories();filter()}for(let [k,v] of Object.entries(modes)){let b=document.createElement('button');let icon=document.createElement('span');icon.setAttribute('aria-hidden','true');icon.textContent={lesson:'◫',quiz:'✎',talk:'◉',review:'☆',grammar:'Aa'}[k];b.append(icon,document.createTextNode(v));b.dataset.mode=k;b.onclick=()=>setMode(k);$('nav').append(b)}
function show(){let r=items[i];$('count').textContent=r?`${i+1} / ${items.length}`:'フレーズがありません';$('bar').max=items.length||1;$('bar').value=r?i+1:0;$('situation').textContent=r?(mode==='talk'?r[0]+' / スタッフの質問':r[0]+' / '+r[1]):'';$('english').textContent=r?(mode==='talk'?r[1]:mode==='quiz'?'英語で言ってみよう！':r[2]):'';$('jp').textContent=r?r[3]:'';$('kata').textContent=r&&mode!=='quiz'&&mode!=='talk'?r[4]:'';$('note').textContent=r&&mode==='lesson'?r.slice(5).join(' / '):'';$('answer').value='';$('feedback').textContent='';$('fav').textContent=r&&fav.includes(r[2])?'★ 保存済み':'★ 保存';for(let id of ['listen','slow','fav','mic','check','reveal','prev','next'])$(id).disabled=!r;$('listen').disabled=!r||mode==='quiz';$('slow').disabled=!r||mode==='quiz'}
function speak(t,rate=.9){if(!('speechSynthesis'in window)){$('feedback').textContent='音声再生に非対応です';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u)}$('listen').onclick=()=>speak(items[i][mode==='talk'?1:2]);$('slow').onclick=()=>speak(items[i][mode==='talk'?1:2],.65);$('category').onchange=filter;function move(n){if(items.length){i=(i+n+items.length)%items.length;show()}}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('fav').onclick=()=>{let t=items[i][2];fav=fav.includes(t)?fav.filter(x=>x!==t):[...fav,t];store('favorites',fav);stats();$('fav').textContent=fav.includes(t)?'★ 保存済み':'★ 保存'};
function norm(s){return s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9 ]/g,' ').trim().replace(/\s+/g,' ')}function check(){let r=items[i],a=$('answer').value.trim();if(!r||!a){$('feedback').textContent='英語を入力してください';return}let ok=norm(a)===norm(r[2]);$('feedback').textContent=(ok?'お手本と一致！':'お手本と異なります。別の自然な言い方もあります。')+'\nお手本：'+r[2]+'\n'+r[4];weak=ok?weak.filter(x=>x!==r[2]):[...new Set([...weak,r[2]])];store('englishV2Weak',weak);record()}$('check').onclick=check;$('reveal').onclick=()=>{$('feedback').textContent=items[i][2]+'\n'+items[i][4];speak(items[i][2])};$('mic').onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('feedback').textContent='このブラウザでは音声認識が使えません。キーボード入力を使ってください。';return}if(recognition)return;let r=new R();recognition=r;r.lang='en-US';r.onresult=e=>{$('answer').value=e.results[0][0].transcript;check()};r.onerror=e=>{$('feedback').textContent='音声認識エラー：'+e.error+'。Safariのマイク許可を確認してください。'};r.onend=()=>{recognition=null;$('mic').textContent='🎙 話す'};try{r.start();$('mic').textContent='聞き取り中…'}catch{recognition=null;$('feedback').textContent='音声認識を開始できませんでした'}};
const grammar=[['Can I ...?','〜してもいいですか？','Can I have a menu, please?','キャナイ ハヴ ア メニュー プリーズ'],['Should I ...?','〜した方がいいですか？','Should I book in advance?','シュダイ ブック イン アドヴァンス'],['I’d like to ...','〜したいです（丁寧）','I’d like to check in, please.','アイド ライク トゥ チェック イン プリーズ'],['Do you have ...?','〜はありますか？','Do you have any recommendations?','ドゥ ユー ハヴ エニー レコメンデイションズ'],['Where is ...?','〜はどこですか？','Where is the station?','ウェア イズ ザ ステイション']];for(let g of grammar){let h=document.createElement('h3');h.textContent=g[0];let p=document.createElement('p');p.textContent=g.slice(1).join('\n');p.style.whiteSpace='pre-line';let b=document.createElement('button');b.textContent='▶ 聞く';b.onclick=()=>{speak(g[2]);record()};$('grammar').append(h,p,b,document.createElement('hr'))}
(async()=>{stats();setMode('lesson');try{let r=await fetch('./phrases.csv');if(!r.ok)throw Error();all=parse(await r.text()).slice(1).filter(r=>r.length>=5&&r[2].trim());if(!all.length)throw Error();categories();filter()}catch{$('status').textContent='phrases.csvを読み込めませんでした。模擬会話・文法は利用できます。'}})();</script></body></html>
